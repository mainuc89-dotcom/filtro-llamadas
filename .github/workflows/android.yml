name: Compilar y probar

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas y compilación
        run: bash ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Filtro-apk
          path: Filtro.apk
          retention-days: 30

      - name: Guardar registro de compilación
        if: always() && github.ref_type == 'branch'
        run: bash ci/push-results.sh build "${{ job.status }}" build.log app/build/reports

  emulator:
    name: Probar en emulador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Filtro-apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/emulator-test.sh

      - name: Guardar capturas
        if: always() && github.ref_type == 'branch'
        run: bash ci/push-results.sh emulador "${{ job.status }}" ci-out

  release:
    name: Publicar versión
    needs: [build, emulator]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Filtro-apk

      - uses: softprops/action-gh-release@v2
        with:
          name: Filtro ${{ github.ref_name }}
          files: Filtro.apk
          make_latest: true
          body: |
            **Para instalar:** abre esta página en tu celular Android, toca **Filtro.apk** y acepta instalar.
            Si aparece "Play Protect no reconoce esta app", toca *Más detalles → Instalar de todas formas*.
            Al abrir Filtro, toca **Activar filtro** y elige Filtro como app de identificación de llamadas.
